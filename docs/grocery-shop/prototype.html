<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FinPet — магазин, контурный макет</title>
  <link rel="stylesheet" href="prototype.css">
  <script src="prototype.js" defer></script>
</head>
<body>
  <div class="reviewbar">
    <div><strong>Магазин</strong><span>Контурный макет · v3</span></div>
    <nav aria-label="Просмотр макета — вне игры">
      <button id="previewAisle">Зал</button>
      <button id="previewPhone" aria-pressed="false">Портрет</button>
      <button id="previewReset" aria-label="Начать макет заново">↻</button>
    </nav>
  </div>
  <main class="game" id="game" aria-label="Продуктовый магазин">
    <header class="gamebar">
      <div class="shopping-list" id="shoppingList" aria-label="Список покупок"></div>
      <div class="balance" aria-label="Баланс 180 рублей"><span class="coin" aria-hidden="true">₽</span><strong>180</strong></div>
    </header>
    <section class="scene" id="scene" aria-label="Зал магазина">
      <div class="world" id="world"></div>
      <div class="actor walking" id="actor"></div>
      <div class="hint" id="hint"><svg class="tap-hand" viewBox="0 0 24 28" fill="white" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 15V5a2 2 0 0 1 4 0v7c6-2 9 1 9 4v5c0 4-3 5-7 5s-5-1-7-4l-4-6c-1-3 2-4 3-2l2 2"/></svg> Нажимай на продукты из списка</div>
      <div class="toast" id="toast" role="status"></div>
      <section class="checkout-paper" id="checkout" aria-label="Проверка покупок" hidden></section>
      <section class="finish-paper" id="finished" aria-label="Результат похода" hidden></section>
    </section>
  </main>
  <p class="reviewnote">Кнопки над рамкой — для просмотра макета. В игре петух идёт сам. Здесь проверяем сбор продуктов; баланс не списывается.</p>
  <dialog id="basketDialog" aria-labelledby="basketTitle">
    <div class="dialog-head"><h2 id="basketTitle">В тележке</h2><button id="closeBasket" aria-label="Закрыть тележку">×</button></div>
    <div id="basketContents"></div>
    <p class="dialog-note">Петух подождёт, пока ты смотришь тележку.</p>
    <button class="action full" id="continueWalk">Готово</button>
  </dialog>
</body>
</html>
